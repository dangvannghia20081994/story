services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: story
      POSTGRES_PASSWORD: story
      POSTGRES_DB: story
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d story"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_public_audio:/var/www/html/storage/app/public
    # Còn lại (APP_*, DB_*, Redis, CORS, …) lấy từ backend/.env trên volume — xem backend/.env.example
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - backend_public_audio:/var/www/html/storage/app/public
    env_file:
      - path: ./worker/.env
        required: false
    # TTS, FPT, … lấy từ worker/.env (env_file) — xem worker/.env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: story:tts:queue
      BACKEND_URL: http://backend:8000
      WORKER_TOKEN: ${WORKER_INTERNAL_TOKEN:-dev-worker-token}
      STORAGE_PUBLIC_ROOT: /var/www/html/storage/app/public
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://backend:8000
    depends_on:
      - backend

  expo:
    build:
      context: ./app
      dockerfile: ../docker/expo.Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - ./app:/app
      - expo_node_modules:/app/node_modules
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "1"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  pgdata:
  backend_public_audio:
  frontend_node_modules:
  expo_node_modules:
