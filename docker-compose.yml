services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: story
      POSTGRES_PASSWORD: story
      POSTGRES_DB: story
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d story"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    # Còn lại (APP_*, DB_*, Redis, CORS, …) lấy từ backend/.env trên volume — xem backend/.env.example
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      REDIS_PREFIX: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Không kèm /api — apiFetch luôn gọi path /api/...
      NEXT_PUBLIC_API_URL: http://story.test
      API_URL: http://backend:8000
    depends_on:
      - backend

  expo:
    build:
      context: ./app
      dockerfile: ../docker/expo.Dockerfile
    ports:
      # Metro web dev: trong container cổng 8081 — host vẫn mở 8090 (README app).
      - "8090:8081"
    volumes:
      - ./app:/app
      - expo_node_modules:/app/node_modules
    environment:
      EXPO_PUBLIC_API_URL: http://story.test
      CHOKIDAR_USEPOLLING: "1"
    # Named volume che node_modules: cài lại khi khởi động để khớp package-lock trên volume.
    command: ["sh", "-c", "npm install && exec npx expo start --web --host lan --port 8081"]
    stdin_open: true
    tty: true
    depends_on:
      - backend

  # Cần `worker-crawler/.env` (token đồng bộ backend). Bật: docker compose --profile crawler up -d
  worker-crawler:
    profiles: ["crawler"]
    build:
      context: ./worker-crawler
      dockerfile: ../docker/crawler.Dockerfile
    volumes:
      - ./worker-crawler:/app
    env_file:
      - ./worker-crawler/.env
    environment:
      REDIS_HOST: redis
      CRAWLER_API_BASE_URL: http://backend:8000
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  # Cần `worker-tts/.env` (WORKER_TTS_INTERNAL_TOKEN trùng backend).
  # Bật: docker compose --profile worker-tts up -d
  worker-tts:
    profiles: ["worker-tts"]
    build:
      context: ./worker-tts
      dockerfile: ../docker/worker-tts.Dockerfile
    env_file:
      - ./worker-tts/.env
    environment:
      REDIS_HOST: redis
      BACKEND_API_BASE_URL: http://backend:8000
    volumes:
      - ./backend/storage/app/private/voices:/app/voices:ro
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    # 6 replicas cùng BLPOP story:tts:queue (competing consumers) → tối đa 6 chương TTS song song.
    # Hạ xuống nếu Revid API trả 429/hết credit. Override runtime: --scale worker-tts=N.
    deploy:
      replicas: 6

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/routes:/etc/nginx/conf.d/routes:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  frontend_node_modules:
  expo_node_modules:
