server {
    listen 80;
    server_name story.test www.story.test;

    # One file per route group.
    include /etc/nginx/conf.d/routes/api.conf;
    include /etc/nginx/conf.d/routes/admin.conf;
    include /etc/nginx/conf.d/routes/login.conf;
    include /etc/nginx/conf.d/routes/storage.conf;
    include /etc/nginx/conf.d/routes/docs.conf;
    include /etc/nginx/conf.d/routes/root.conf;
}
